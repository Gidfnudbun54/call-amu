<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Call Amu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f7ff;
      padding: 30px 15px;
      margin: 0;
    }

    h1 {
      color: #174ea6;
    }

    p {
      font-size: 18px;
    }

    button {
      background: #16803c;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 20px;
      cursor: pointer;
      margin: 10px;
    }

    button:hover {
      background: #11652f;
    }

    video {
      width: 320px;
      max-width: 100%;
      background: black;
      border-radius: 12px;
      margin-top: 15px;
    }

    #status {
      margin-top: 20px;
      color: #174ea6;
    }
  </style>
</head>

<body>
  <h1>Call Amu ❤️</h1>

  <p>Click the button below to talk to your mother.</p>

  <button onclick="startCall()">📹 Call Amu</button>

  <p id="status">Ready to call</p>

  <hr>

  <h2>Camera Test</h2>

  <p>Test your camera and microphone before making a call.</p>

  <video id="myVideo" autoplay playsinline muted></video>

  <br>

  <button onclick="startCamera()">Turn On Camera</button>

  <button onclick="stopCamera()">Turn Off Camera</button>

  <script>
    let cameraStream = null;

    function startCall() {
      document.getElementById("status").textContent =
        "Video calling is not connected yet.";
    }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        document.getElementById("myVideo").srcObject = cameraStream;

        document.getElementById("status").textContent =
          "Camera and microphone are on.";
      } catch (error) {
        document.getElementById("status").textContent =
          "Camera could not start. Please check your browser permissions.";

        alert("Error: " + error.message);
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      document.getElementById("myVideo").srcObject = null;

      document.getElementById("status").textContent =
        "Camera is off.";
    }
  </script>
</body>
</html>
