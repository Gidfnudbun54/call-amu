<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call Amu</title>

    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f6fc;
            margin: 0;
            padding: 25px 12px;
        }

        h1 {
            color: #174ea6;
        }

        p {
            color: #444;
        }

        button {
            padding: 13px 22px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #callButton {
            background: #16803c;
            color: white;
        }

        #cameraButton {
            background: #174ea6;
            color: white;
        }

        #stopButton {
            background: #b42318;
            color: white;
        }

        #status {
            margin: 15px;
            font-weight: bold;
        }

        #jitsi-container {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
        }

        #myVideo {
            width: 100%;
            max-width: 500px;
            background: #222;
            border-radius: 10px;
        }

        .section {
            background: white;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px 10px;
            border-radius: 12px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>Call Amu ❤️</h1>

    <p>Click the button below to start a video call.</p>

    <button id="callButton" onclick="startCall()">
        📹 Call Amu
    </button>

    <p id="status">Ready to start your call.</p>

    <div id="jitsi-container"></div>

    <div class="section">

        <h2>Camera Test</h2>

        <p>Check whether your laptop camera and microphone are working.</p>

        <button id="cameraButton" onclick="startCamera()">
            Turn On Camera
        </button>

        <button id="stopButton" onclick="stopCamera()">
            Turn Off Camera
        </button>

        <br><br>

        <video id="myVideo" autoplay playsinline muted></video>

        <p id="cameraStatus">Camera is off.</p>

    </div>

    <script>
        let jitsiApi = null;
        let cameraStream = null;

        function startCall() {
            const status = document.getElementById("status");
            const container = document.getElementById("jitsi-container");

            if (jitsiApi) {
                status.textContent = "The video call is already open.";
                return;
            }

            if (typeof JitsiMeetExternalAPI === "undefined") {
                status.textContent =
                    "Video call could not load. Please refresh the page.";
                return;
            }

            stopCamera();

            status.textContent = "Loading video call...";

            container.innerHTML = "";

            try {
                jitsiApi = new JitsiMeetExternalAPI("meet.jit.si", {
                    roomName: "Call-Amu-Shakil-2026",
                    parentNode: container,
                    width: "100%",
                    height: 600
                });

                status.textContent =
                    "Video call opened. Join the meeting when ready.";

                jitsiApi.addListener("videoConferenceJoined", function () {
                    status.textContent = "You have joined the video call.";
                });

                jitsiApi.addListener("videoConferenceLeft", function () {
                    status.textContent = "You left the video call.";
                });

                jitsiApi.addListener("readyToClose", function () {
                    jitsiApi = null;
                    container.innerHTML = "";
                    status.textContent = "Call ended.";
                });

            } catch (error) {
                status.textContent =
                    "Could not start the call. Please try again.";
                console.error(error);
            }
        }

        async function startCamera() {
            const video = document.getElementById("myVideo");
            const cameraStatus = document.getElementById("cameraStatus");

            try {
                if (!navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia) {
                    cameraStatus.textContent =
                        "Camera is not supported in this browser.";
                    return;
                }

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });

                video.srcObject = cameraStream;

                cameraStatus.textContent =
                    "Camera and microphone are working.";

            } catch (error) {
                cameraStatus.textContent =
                    "Camera access failed. Please check permissions.";

                console.error(error);
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(function (track) {
                    track.stop();
                });

                cameraStream = null;
            }

            const video = document.getElementById("myVideo");

            video.srcObject = null;

            document.getElementById("cameraStatus").textContent =
                "Camera is off.";
        }
    </script>

</body>
</html>
